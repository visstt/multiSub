name: Backend CI/CD

on:
  push:
    branches: [main, develop]
    paths: ["apps/backend/**"]
  pull_request:
    branches: [main, develop]
    paths: ["apps/backend/**"]

jobs:
  test:
    name: Lint & Test
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: multisub_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"
          cache-dependency-path: apps/backend/go.sum
      - name: Install dependencies
        working-directory: apps/backend
        run: go mod download
      - name: golangci-lint
        uses: golangci/golangci-lint-action@v4
        with:
          working-directory: apps/backend
      - name: Run tests
        working-directory: apps/backend
        env:
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/multisub_test?sslmode=disable
          JWT_SECRET: ci-test-secret-min-32-characters-long
        run: |
          go test ./... -race -count=1 \
            -coverprofile=coverage.out -covermode=atomic -timeout=120s
      - name: Check coverage
        working-directory: apps/backend
        run: |
          COV=$(go tool cover -func coverage.out | grep total | awk '{print $3}' | tr -d '%')
          echo "Coverage: $COV%"

  build:
    name: Build Docker image
    runs-on: ubuntu-latest
    needs: test
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop'
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v5
        with:
          context: apps/backend
          push: true
          tags: ghcr.io/${{ github.repository }}/backend:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
