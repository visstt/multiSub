name: PR Checks

on:
  pull_request:
    branches: [main, develop]

jobs:
  pr-title:
    name: Conventional Commits
    runs-on: ubuntu-latest
    steps:
      - uses: amannn/action-semantic-pull-request@v5
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          types: [feat, fix, docs, style, refactor, test, chore, ci, perf]
